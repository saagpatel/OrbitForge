name: quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Tauri prerequisites
        run: |
          SUDO_CMD="$(command -v sudo || true)"
          "$SUDO_CMD" apt-get update
          "$SUDO_CMD" apt-get install -y \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable as of 2026-10-05
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: STRICT_WORKSPACE_PATH=1 pnpm run dev:path:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm build
